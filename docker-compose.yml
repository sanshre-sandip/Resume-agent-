services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./resume_creator/generated:/app/resume_creator/generated
      - ./resume_creator/uploads:/app/resume_creator/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
